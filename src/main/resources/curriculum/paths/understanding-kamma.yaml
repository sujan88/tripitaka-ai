  description: "බුදුරජාණන් වහන්සේ කර්මය ලෙස අදහස් කළේ කුමක්ද, එය ඉරණම නොව චේතනාව වන්නේ ඇයි, එය මේ ජීවිතයට හා මතු ජීවිතයට බලපාන්නේ කෙසේද, එය අවසන් වන්නේ කෙසේද."
  outcomes:
