id: understanding-kamma
order: 3
title: Understanding kamma
level: intermediate
blurb: Intention, why people differ, kamma is not fate, and the end of kamma.
description: >-
  What the Buddha meant by kamma, why it is intention and not fate, how it shapes this life and the next,
  and how it comes to an end.
keyTexts: [AN 6.63, MN 135, AN 3.61]
minutesPerLesson: 15
reviewedBy: null
outcomes:
  - Why intention (cetanā) is what makes an act kamma
  - Why kamma is not fate or a god’s will
  - How actions shape this life and future births
  - What it means to go beyond kamma
before: [new-to-buddhism]
after: [rebirth-and-realms, dependent-origination]
questions:
  - Is everything that happens to me my kamma?
  - Can merit be shared with the departed?
si:
