    - "මට සිදුවන සියල්ල මගේ කර්මය ද?"
    - "මියගිය අයට පින් අනුමෝදන් කළ හැකිද?"
lessons:
  - id: kamma-intention
    title: "What kamma means: intention"
    keyText: AN 6.63
    textIds: [an6.63]
    question: What does the Buddha mean when he says that intention is kamma?
    reflectPrompt: >-
      Think of something you did today without much thought. Was there an intention behind it after all?
    quiz:
      question: In AN 6.63, what does the Buddha call kamma (deeds)?
      options:
        - Fate decided at birth
        - Intention
        - Rituals done at a temple
      answer: 1
      explanation: >-
        “It is intention that I call deeds. For after making a choice one acts by way of body, speech, and mind.”
    si:
      title: "කර්මය යනු කුමක්ද: චේතනාව"
      keyText: "නිබ්බේධික සූත්‍රය"
      textIds: [an-6-2-1-9]
      question: "චේතනාව කර්මය බව වදාළ විට බුදුරජාණන් වහන්සේ අදහස් කළේ කුමක්ද?"
      reflectPrompt: "අද ඔබ එතරම් නොසිතා කළ දෙයක් සිහි කරන්න. ඒ පිටුපස චේතනාවක් තිබුණාද?"
      quiz:
        question: "නිබ්බේධික සූත්‍රයේ බුදුරජාණන් වහන්සේ කර්මය ලෙස හඳුන්වන්නේ කුමක්ද?"
        options:
          - "උපතේදී තීරණය වූ ඉරණම"
          - "චේතනාව"
          - "පන්සලේ කරන චාරිත්‍ර"
        explanation: "බුදුරජාණන් වහන්සේ චේතනාව ම කර්මය ලෙස වදාරති: චේතනා කොට කයින්, වචනයෙන් හා සිතින් ක්‍රියා කරයි."

  - id: kamma-not-fate
    title: Kamma is not fate
    keyText: AN 3.61
    textIds: [an3.61]
    question: Why does the Buddha reject the view that everything we experience is caused by past deeds?
    reflectPrompt: >-
      When something goes wrong, do you tend to blame the past, other people, or chance? What would change if you
      looked at what you can choose now?
    quiz:
      question: Which view does the Buddha reject in AN 3.61?
      options:
        - That everything a person experiences is because of past deeds
        - That intentional deeds have results
        - That one can give up unskilful deeds
      answer: 0
      explanation: >-
        He rejects three tenets: that everything we experience comes from past deeds, from God’s creation, or from
        no cause at all. Each one, taken to its conclusion, leaves no room for choosing what to do now.
    si:
      title: "කර්මය ඉරණම නොවේ"
      keyText: "තිත්ථායතන සූත්‍රය"
      textIds: [an-3-2-2]
      question: "අප විඳින සියල්ල පෙර කළ කර්මය නිසා ම ය යන මතය බුදුරජාණන් වහන්සේ ප්‍රතික්ෂේප කළේ ඇයි?"
      reflectPrompt: "යමක් වැරදුණු විට ඔබ දොස් පවරන්නේ අතීතයට ද, අනුන්ට ද, අහම්බයට ද? දැන් ඔබට තෝරා ගත හැකි දේ දෙස බැලුවොත් කුමක් වෙනස් වේද?"
      quiz:
        question: "තිත්ථායතන සූත්‍රයේ බුදුරජාණන් වහන්සේ ප්‍රතික්ෂේප කරන මතය කුමක්ද?"
        options:
          - "පුද්ගලයා විඳින සියල්ල පෙර කළ කර්මය නිසා ම ය යන්න"
          - "චේතනාවෙන් කළ කර්මවලට විපාක ඇති බව"
          - "අකුසල කර්ම අත්හැරිය හැකි බව"
        explanation: "සියල්ල පෙර කර්මය නිසා, ඊශ්වර නිර්මාණය නිසා, හෝ හේතුවක් නැතිව සිදු වේ යන මත තුනම උන්වහන්සේ ප්‍රතික්ෂේප කරති. ඒ කුමන මතය පිළිගත්තද, දැන් කළ යුත්ත තෝරා ගැනීමට ඉඩක් නොරැඳේ."

  - id: kamma-born-different
    title: Why are people born different?
    keyText: MN 135
    textIds: [mn135]
    question: Why are people born different, according to MN 135?
    reflectPrompt: >-
      Think of one habit of speech you repeat every day. What intention usually sits behind it?
    quiz:
      question: In MN 135, what does the Buddha say leads to a long life?
      options:
        - Being born into a good family
        - Refraining from killing living beings
        - Making offerings at a temple
      answer: 1
      explanation: >-
        Giving up killing, living with sympathy for all living beings, leads towards a long life; killing leads
        towards a short one.
    si:
      title: "මිනිසුන් එකිනෙකාට වෙනස්ව උපදින්නේ ඇයි?"
      keyText: "චූළකම්මවිභඞ්ග සූත්‍රය (ම. නි. 135)"
      textIds: [mn-3-4-5]
      question: "චූළකම්මවිභඞ්ග සූත්‍රයට අනුව මිනිසුන් එකිනෙකාට වෙනස්ව උපදින්නේ ඇයි?"
      reflectPrompt: "ඔබ දිනපතා නැවත නැවත කියන වචනයක් සිහි කරන්න. සාමාන්‍යයෙන් ඒ පිටුපස ඇත්තේ කුමන චේතනාවක්ද?"
      quiz:
        question: "චූළකම්මවිභඞ්ග සූත්‍රයට අනුව දීර්ඝායුෂයට හේතු වන්නේ කුමක්ද?"
        options:
          - "හොඳ පවුලක ඉපදීම"
          - "සතුන් මැරීමෙන් වැළකීම"
          - "පන්සලට පූජා කිරීම"
        explanation: "සතුන් මැරීමෙන් වැළකී, සියලු සතුන් කෙරෙහි දයාවෙන් වාසය කිරීම දීර්ඝායුෂයට හේතු වේ; සතුන් මැරීම අල්පායුෂයට හේතු වේ."

  - id: kamma-four-kinds
    title: Four kinds of kamma
    keyText: AN 4.232
    textIds: [an4.232]
    question: What are the four kinds of kamma the Buddha describes in AN 4.232?
    reflectPrompt: >-
      Look back on yesterday. Which of your actions were clearly bright, which were dark, and which were mixed?
    quiz:
      question: According to AN 4.232, what do deeds that are neither dark nor bright lead to?
      options:
        - A rebirth in heaven
        - Mixed results, pleasant and painful
        - The ending of deeds
      answer: 2
      explanation: >-
        Neither dark nor bright deeds, with neither dark nor bright results, lead to the ending of deeds.
    si:
      title: "කර්ම වර්ග සතර"
      keyText: "ප්‍රථම කර්ම සූත්‍රය (අඞ්ගුත්තර නිකාය, කර්ම වර්ගය)"
      textIds: [an-4-5-4-1]
      question: "කර්ම සූත්‍රයේ බුදුරජාණන් වහන්සේ දේශනා කරන කර්ම වර්ග සතර මොනවාද?"
      reflectPrompt: "ඊයේ දවස සිහි කරන්න. ඔබේ ක්‍රියාවලින් පැහැදිලිවම කුසල වූයේ කුමක්ද, අකුසල වූයේ කුමක්ද, මිශ්‍ර වූයේ කුමක්ද?"
      quiz:
        question: "කෘෂ්ණත් නොවූ ශුක්ලත් නොවූ කර්මය කුමකට හේතු වේද?"
        options:
          - "දිව්‍ය ලෝකයක ඉපදීමට"
          - "සැප දුක් මිශ්‍ර විපාකවලට"
          - "කර්ම ක්‍ෂය වීමට"
        explanation: "කෘෂ්ණත් නොවූ ශුක්ලත් නොවූ විපාක ඇති, කෘෂ්ණත් නොවූ ශුක්ලත් නොවූ කර්මය කර්ම ක්‍ෂය පිණිස පවතී."

  - id: kamma-rebirth
    title: Kamma and rebirth
    keyText: MN 136
    textIds: [mn136]
    question: How does MN 136 explain someone who did bad deeds being reborn in a good place?
    reflectPrompt: >-
      Why might it matter what state of mind you are in at the end of a day, or at the end of a life?
    quiz:
      question: In MN 136, why can someone who did bad deeds still be reborn in a good place?
      options:
        - A good deed done earlier or later, or right view taken up at the time of death
        - Kamma has no results after death
        - A god forgives the deed
      answer: 0
      explanation: >-
        The Buddha explains that a person’s rebirth depends on other deeds done earlier or later, or on the view
        they take up at the time of death, so no single deed tells the whole story.
    si:
      title: "කර්මය සහ පුනර්භවය"
      keyText: "මහාකම්මවිභඞ්ග සූත්‍රය (ම. නි. 136)"
      textIds: [mn-3-4-6]
      question: "අකුසල කළ අයෙකු සුගතියක ඉපදීම මහාකම්මවිභඞ්ග සූත්‍රය පහදා දෙන්නේ කෙසේද?"
      reflectPrompt: "දවසක් අවසානයේ හෝ ජීවිතයක් අවසානයේ ඔබේ සිත කුමන තත්ත්වයක පවතීද යන්න වැදගත් වන්නේ ඇයි?"
      quiz:
