    - "කර්මය ඉරණමක් හෝ දෙවියෙකුගේ කැමැත්තක් නොවන්නේ ඇයි"
    - "ක්‍රියා මේ ජීවිතයට හා මතු උපත්වලට බලපාන ආකාරය"
    - "කර්මයෙන් එතෙර වීම යනු කුමක්ද"
