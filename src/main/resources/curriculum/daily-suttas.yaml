# "Today's sutta" on the home page: one entry per day, in turn. Curated; the text is a paraphrase, not a quotation.
suttas:
  - id: dhp-1-2
    title: Dhammapada 1–2
    text: >-
      Mind comes first: actions done with a corrupt mind bring suffering, and actions done with a clear mind bring
      happiness.
    note: Paraphrase · Khuddaka Nikāya
    question: What do the first two verses of the Dhammapada teach about the mind?
    reviewedBy: null
    si:
      title: "ධම්මපදය 1–2"
      text: "සිත පෙරටු කොට ඇත්තේය: දූෂිත සිතින් කරන ක්‍රියා දුක ගෙන දෙයි; පැහැදුණු සිතින් කරන ක්‍රියා සැප ගෙන දෙයි."
      note: "අදහස සැකෙවින් · ඛුද්දක නිකාය"
      question: "ධම්මපදයේ පළමු ගාථා දෙකෙන් සිත ගැන උගන්වන්නේ කුමක්ද?"
