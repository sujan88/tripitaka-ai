          - "මරණයෙන් පසු කර්මයට විපාක නැති නිසා"
          - "දෙවියෙක් එම පාපය සමා කරන නිසා"
        explanation: "පුද්ගලයෙකුගේ උපත පෙර හෝ පසු කළ වෙනත් කර්ම මත ද, මරණ මොහොතේ ගන්නා දෘෂ්ටිය මත ද රඳා පවතින බව බුදුරජාණන් වහන්සේ පහදා දෙති. එබැවින් එක් කර්මයකින් පමණක් සම්පූර්ණ කතාව නොකියැවේ."

