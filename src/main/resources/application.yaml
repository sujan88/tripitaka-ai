spring:
  application:
    name: tripitaka-rag
  autoconfigure:
    # Spring AI's single default Qdrant store is not used: VectorStores opens one store per collection.
    exclude: org.springframework.ai.vectorstore.qdrant.autoconfigure.QdrantVectorStoreAutoConfiguration
  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        model: ${OPENAI_MODEL:gpt-5.4-nano}
      embedding:
        # Swap for a multilingual model before ingesting Sinhala text (see README).
        model: ${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}
    retry:
      max-attempts: 2
    chat:
      memory:
        repository:
          jdbc:
            initialize-schema: always
    vectorstore:
      qdrant:
        # Connection only. Each logical collection has its own Qdrant collection (see VectorStores):
        # sutta-en -> tripitaka_sutta_en, sutta-si -> tripitaka_sutta_si.
        host: localhost
        port: 6334
        use-tls: false

  datasource:
    url: jdbc:h2:file:./data/tripitaka
    username: sa
    password: ""
  flyway:
    enabled: true

server:
  # Local-only until auth is added (see README "Next steps").
  # SERVER_ADDRESS=0.0.0.0 lets a phone on the same Wi-Fi reach it: trusted networks only, there is no login.
  address: ${SERVER_ADDRESS:127.0.0.1}

rag:
  collection: ${TRIPITAKA_COLLECTION:sutta-en}
  sinhala:
    # Sinhala page (/si.html) and requests with "language":"si" search this collection.
    collection: ${TRIPITAKA_SI_COLLECTION:sutta-si}
    # Explanatory layers searched with the suttas unless the page asks for "suttas only". Each is its own
    # collection; one that is not ingested yet is skipped.
    layers: abhidhamma-si,atthakatha-si,visuddhimagga-si
  # Candidates per search method; the merged list (up to 2x) is reranked down to answer-chunks.
  top-k: 25
  similarity-threshold: ${RAG_SIMILARITY_THRESHOLD:0.25}
  answer-chunks: 6
  # The vector and BM25 searches of one question (queries x collections x 2) run on this many threads;
  # 1 runs them one after another. A search not finished within timeout-ms counts as returning nothing.
  search:
    threads: ${RAG_SEARCH_THREADS:8}
    timeout-ms: ${RAG_SEARCH_TIMEOUT_MS:20000}
  # Multi-query search: a model adds up to 3 searches (the sutta a question describes, the canon's
  # wording with Pali terms, sub-questions); the reranker sees them too. Measured (search hit rate):
  #   off: EN 7/8, SI 12/18, SI held-out 4/10 | gpt-5.4-mini: SI 12/18, held-out 6/10
  #   gpt-5.4: EN 8/8, SI 16/18, SI held-out 8/10 (about +4 s and one extra call per question)
  query-expansion:
    enabled: ${RAG_QUERY_EXPANSION:true}
    model: ${RAG_EXPANSION_MODEL:gpt-5.4}
  # First questions (lessons, Dhamma questions) asked exactly like an earlier one are answered from this cache,
  # with no model call. The key includes the corpus releases, models and prompts, so any change starts fresh.
  answer-cache:
    enabled: ${RAG_ANSWER_CACHE:true}
    ttl-days: ${RAG_ANSWER_CACHE_TTL_DAYS:30}
  # Final answers use this model. Follow-up rewriting and expansion share one call on query-expansion.model.
  answer-model: ${ANSWER_MODEL:gpt-5.4-mini}
  context:
    # Chunks added on each side of a search hit, and the character budget for them (~4 chars per token).
    neighbors: ${RAG_CONTEXT_NEIGHBORS:1}
    max-chars: ${RAG_CONTEXT_MAX_CHARS:30000}
  bm25:
    path: ./data/bm25
  rerank:
    enabled: ${RERANK_ENABLED:false}
    api-key: ${COHERE_API_KEY:}
    model: ${COHERE_RERANK_MODEL:rerank-v3.5}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

logging:
  level:
    com.sujan.tripitaka: INFO
